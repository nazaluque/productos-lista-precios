name: Build FRN WordPress pack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frn-stock-prices/**'
      - 'frn-home/**'
      - 'release/**'
      - '.github/workflows/build-plugin.yml'
  push:
    branches: [main, feature/tarifas-semanales-v1]
    paths:
      - 'frn-stock-prices/**'
      - 'frn-home/**'
      - 'release/**'
      - '.github/workflows/build-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Validate PHP syntax
        run: find frn-stock-prices frn-home -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate FRN 1.1 contract
        run: |
          grep -q "Version: 1.1.0" frn-stock-prices/frn-stock-prices.php
          grep -q "frn_product_history" frn-stock-prices/includes/class-frn-catalog-repository.php
          grep -q "frn_front_preview_stock" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "frn_front_user_save" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "Actualmente no hay próximos ingresos informados" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "frn_front_tariff_pdf" frn-stock-prices/templates/partials/app-tariff-editor.php
      - name: Install stock plugin dependencies
        working-directory: frn-stock-prices
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Create clear installable pack
        run: |
          mkdir -p build
          zip -r build/01-INSTALAR-FRN-STOCK-PRECIOS-v1.1.0.zip frn-stock-prices -x '*/composer.lock' -x '*/composer.json'
          zip -r build/02-INSTALAR-FRN-HOME-v1.1.0.zip frn-home
          cp release/LEEME-PRIMERO.txt build/LEEME-PRIMERO.txt
          cd build
          zip -r ../FRN-PLUGINS-v1.1.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: FRN-PLUGINS-v1.1.0
          path: FRN-PLUGINS-v1.1.0.zip
          if-no-files-found: error
