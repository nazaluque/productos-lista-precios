name: Build FRN WordPress pack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frn-stock-prices/**'
      - 'frn-home/**'
      - 'release/**'
      - '.github/workflows/build-plugin.yml'
  push:
    branches: [main, feature/tarifas-semanales-v1, feature/pedidos-proformas-v1, feature/pedidos-internos-v1, fix/pdf-rendering-v1.3.2-portugal]
    paths:
      - 'frn-stock-prices/**'
      - 'frn-home/**'
      - 'release/**'
      - '.github/workflows/build-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Validate PHP syntax
        run: find frn-stock-prices frn-home -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate FRN 1.3.2 contract
        run: |
          grep -q "Version: 1.3.2" frn-stock-prices/frn-stock-prices.php
          grep -q "frn_product_history" frn-stock-prices/includes/class-frn-catalog-repository.php
          grep -q "frn_front_preview_stock" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "frn_front_user_save" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "Actualmente no hay próximos ingresos informados" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "frn_front_tariff_pdf" frn-stock-prices/templates/partials/app-tariff-editor.php
          grep -q "commercial_group" frn-stock-prices/includes/class-frn-catalog-repository.php
          grep -q "primary_lang" frn-stock-prices/includes/class-frn-tariff-repository.php
          grep -q "Categorías / orden comercial" frn-stock-prices/templates/partials/app-import.php
          grep -q "setPaper('A4', 'landscape')" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "header-photo" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "SIN CATEGORÍA" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "Totales detectados por unidad" frn-stock-prices/templates/partials/app-preview.php
          grep -q "Archivo analizado · todavía NO se ha publicado" frn-stock-prices/templates/partials/app-import.php
          grep -q "frn_front_save_translations" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "Pronosticado" frn-stock-prices/templates/partials/app-import.php || true
          grep -q "pronosticado" frn-stock-prices/includes/class-frn-excel-importer.php
          grep -q "PICAÑA" frn-stock-prices/includes/class-frn-stock-prices.php
          grep -q "frn_commercial_groups" frn-stock-prices/includes/class-frn-catalog-repository.php
          grep -q "Productos con categoría pendiente" frn-stock-prices/templates/partials/app-preview.php
          grep -q "Maestro cerrado" frn-stock-prices/templates/partials/app-translations.php
          grep -q "frn_pdf_header_position_" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "height:128px" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "font-size:7.6pt" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "pdf-watermark" frn-stock-prices/includes/class-frn-frontend-app.php
          ! grep -q "canvas->image($watermarkPath" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "frn_customers" frn-stock-prices/includes/class-frn-order-repository.php
          grep -q "frn_orders" frn-stock-prices/includes/class-frn-order-repository.php
          grep -q "frn_front_order_save" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "frn_front_order_pdf" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "frn_front_order_send" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "Pedidos / Proformas" frn-stock-prices/templates/app-v1.php
          grep -q "gc@frnatlantico.com" frn-stock-prices/includes/class-frn-frontend-app.php
          grep -q "Compartir por WhatsApp" frn-stock-prices/templates/partials/app-order-editor.php
          grep -q "Importe parcial" frn-stock-prices/assets/app.js
      - name: Install stock plugin dependencies
        working-directory: frn-stock-prices
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Create direct installable stock plugin
        run: |
          mkdir -p build
          zip -r build/FRN-STOCK-PRECIOS-v1.3.2.zip frn-stock-prices -x '*/composer.lock' -x '*/composer.json'
          zip -r build/FRN-HOME-v1.3.2.zip frn-home
          cp release/LEEME-PRIMERO.txt build/LEEME-PRIMERO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FRN-STOCK-PRECIOS-v1.3.2
          path: build/FRN-STOCK-PRECIOS-v1.3.2.zip
          if-no-files-found: error
