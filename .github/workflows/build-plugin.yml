name: Build WordPress plugin ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frn-stock-prices/**'
      - '.github/workflows/build-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install production dependencies
        working-directory: frn-stock-prices
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Create installable plugin
        run: zip -r frn-stock-prices.zip frn-stock-prices -x '*/composer.lock' -x '*/composer.json'
      - uses: actions/upload-artifact@v4
        with:
          name: frn-stock-prices
          path: frn-stock-prices.zip
          if-no-files-found: error
