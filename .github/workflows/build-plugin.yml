name: Build FRN WordPress pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frn-stock-prices/**'
      - 'frn-home/**'
      - 'release/**'
      - '.github/workflows/build-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Validate PHP syntax
        run: find frn-stock-prices frn-home -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install stock plugin dependencies
        working-directory: frn-stock-prices
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Create clear installable pack
        run: |
          mkdir -p build
          zip -r build/01-INSTALAR-FRN-STOCK-PRECIOS-v0.5.0.zip frn-stock-prices -x '*/composer.lock' -x '*/composer.json'
          zip -r build/02-INSTALAR-FRN-HOME-v1.0.0.zip frn-home
          cp release/LEEME-PRIMERO.txt build/LEEME-PRIMERO.txt
          cd build
          zip -r ../FRN-PLUGINS-v0.5.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: FRN-PLUGINS-v0.5
          path: FRN-PLUGINS-v0.5.zip
          if-no-files-found: error
